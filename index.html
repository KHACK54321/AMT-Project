<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AM-Tool Repository</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .header-left .logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(167,139,250,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }
        .header-left .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }
        .header-left h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-left .sub { font-size:0.85rem; color:#8899b0; -webkit-text-fill-color:#8899b0; }
        .header-right .badge {
            background: rgba(167,139,250,0.15);
            border:1px solid rgba(167,139,250,0.2);
            padding:0.3rem 0.9rem;
            border-radius:20px;
            font-size:0.75rem;
            color:#a78bfa;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px,1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .tool-card {
            background: rgba(20,28,40,0.7);
            backdrop-filter: blur(12px);
            border:1px solid rgba(255,255,255,0.06);
            border-radius:18px;
            padding:1.5rem;
            transition: all 0.3s;
            position:relative;
            overflow:hidden;
            display: flex;
            flex-direction: column;
        }
        .tool-card:hover {
            transform: translateY(-4px);
            border-color: rgba(167,139,250,0.2);
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.6);
        }
        .tool-card::before {
            content:'';
            position:absolute;
            top:0; left:0; right:0; height:2px;
            background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
            opacity:0;
            transition:opacity 0.3s;
        }
        .tool-card:hover::before { opacity:1; }
        .tool-header {
            display:flex;
            align-items:center;
            gap:1rem;
            margin-bottom:0.5rem;
        }
        .tool-avatar {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            flex-shrink: 0;
            overflow: hidden;
        }
        .tool-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .tool-name-group { flex:1; min-width:0; }
        .tool-name {
            font-size:1.25rem;
            font-weight:600;
            color:#f0f4fa;
        }
        .tool-id {
            font-size:0.7rem;
            color:#5a6f88;
            font-family:monospace;
            background:rgba(255,255,255,0.04);
            padding:0.1rem 0.5rem;
            border-radius:4px;
            display:inline-block;
            margin-top:0.1rem;
        }
        .tool-description {
            color:#b0c4db;
            font-size:0.92rem;
            line-height:1.6;
            margin:0.3rem 0 0.8rem 0;
            flex:1;
        }
        .tool-meta {
            display:flex;
            gap:1rem;
            font-size:0.75rem;
            color:#5a6f88;
            margin-bottom:1rem;
            flex-wrap:wrap;
        }
        .tool-meta i { margin-right:0.2rem; }
        .tool-size {
            color: #60a5fa;
            font-weight:500;
        }
        .btn-detail {
            display:inline-flex;
            align-items:center;
            gap:0.5rem;
            padding:0.5rem 1.2rem;
            border-radius:10px;
            font-weight:600;
            font-size:0.85rem;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color:#fff;
            border:none;
            cursor:pointer;
            text-decoration:none;
            transition: all 0.25s;
            justify-content:center;
        }
        .btn-detail:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(124,58,237,0.35); }

        /* CHANGELOG ACCORDION */
        .changelog-section {
            margin: 2rem 0;
            padding: 1.5rem;
            background: rgba(20,28,40,0.5);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .changelog-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .changelog-section .section-header h2 {
            font-size: 1.4rem;
            color: #f0f4fa;
        }
        .changelog-section .section-header h2 i {
            color: #a78bfa;
            margin-right: 0.5rem;
        }
        .changelog-section .section-header .toggle-icon {
            font-size: 1.2rem;
            color: #8899b0;
            transition: transform 0.3s;
        }
        .changelog-section .section-header .toggle-icon.open {
            transform: rotate(180deg);
        }
        .changelog-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            padding: 0;
        }
        .changelog-content.open {
            max-height: 1000px;
            padding-top: 1rem;
        }
        .changelog-item {
            margin-bottom: 0.8rem;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            overflow: hidden;
            background: rgba(0,0,0,0.2);
        }
        .changelog-item-header {
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: transparent;
            border: none;
            color: #e8edf5;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            text-align: left;
        }
        .changelog-item-header:hover {
            background: rgba(255,255,255,0.05);
        }
        .changelog-item-header .version-badge {
            background: rgba(167,139,250,0.15);
            color: #a78bfa;
            padding: 0.2rem 0.7rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .changelog-item-header .toggle-icon {
            transition: transform 0.3s;
            font-size: 0.8rem;
            color: #8899b0;
        }
        .changelog-item-header .toggle-icon.open {
            transform: rotate(180deg);
        }
        .changelog-item-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            padding: 0 1.2rem;
        }
        .changelog-item-body.open {
            max-height: 500px;
            padding: 0.5rem 1.2rem 1rem 1.2rem;
        }
        .changelog-item-body ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .changelog-item-body ul li {
            padding: 0.3rem 0 0.3rem 1.5rem;
            position: relative;
            color: #b8cce0;
            font-size: 0.9rem;
            line-height: 1.5;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .changelog-item-body ul li:last-child {
            border-bottom: none;
        }
        .changelog-item-body ul li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: #60a5fa;
        }
        .changelog-empty {
            color: #5a6f88;
            font-style: italic;
            padding: 0.5rem 0;
        }

        .footer {
            margin-top:3rem;
            padding-top:1.5rem;
            border-top:1px solid rgba(255,255,255,0.04);
            text-align:center;
            font-size:0.8rem;
            color:#3b4a5e;
        }
        .loading-shimmer {
            display:inline-block;
            width:60px;
            height:1em;
            background: linear-gradient(90deg, #3b4a5e 25%, #5a6f88 50%, #3b4a5e 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius:4px;
            vertical-align:middle;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .notice {
            background:rgba(251,191,36,0.1);
            border:1px solid #fbbf24;
            border-radius:12px;
            padding:0.8rem 1.2rem;
            margin-bottom:1.5rem;
            color:#fbbf24;
            text-align:center;
        }
        @media (max-width:768px) {
            body { padding:1rem; }
            .header { flex-direction:column; align-items:flex-start; }
            .tools-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <!-- Thay bằng ảnh logo: <img src="images/logo-dark.png" alt="Logo"> -->
                <img src="images/logo-dark.png" alt="Logo">
            </div>
            <div>
                <h1>AM-Tool Repository</h1>
                <span class="sub">· GitHub Pages</span>
            </div>
        </div>
        <div class="header-right">
            <span class="badge"><i class="fas fa-database"></i> <span id="toolCount">0</span> tools</span>
        </div>
    </header>

    <!-- DANH SÁCH TOOL -->
    <div class="tools-grid" id="toolsGrid"></div>

    <!-- CHANGELOG CỦA WEB (Accordion) -->
    <section class="changelog-section">
        <div class="section-header" onclick="toggleSection(this)">
            <h2><i class="fas fa-history"></i> Cập nhật của Repository</h2>
            <i class="fas fa-chevron-down toggle-icon"></i>
        </div>
        <div class="changelog-content" id="changelogContainer">
            <!-- JS sẽ render -->
        </div>
    </section>

    <footer class="footer">
        <p><i class="fas fa-ghost"></i> AM-Tool Repository &mdash; Dữ liệu từ <code>tools.json</code> &amp; <code>changelog.json</code></p>
    </footer>
</div>

<script>
    (function() {
        const grid = document.getElementById('toolsGrid');
        const countSpan = document.getElementById('toolCount');
        const changelogContainer = document.getElementById('changelogContainer');

        // ----- HÀM LẤY KÍCH THƯỚC FILE -----
        function getFileSize(url) {
            return fetch(url, { method: 'HEAD' })
                .then(res => {
                    if (!res.ok) throw new Error('File not found');
                    const size = res.headers.get('content-length');
                    if (size) {
                        const bytes = parseInt(size, 10);
                        return formatSize(bytes);
                    }
                    return null;
                })
                .catch(() => null);
        }
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
            return (bytes / 1073741824).toFixed(2) + ' GB';
        }

        // ----- RENDER DANH SÁCH TOOL (chỉ 1 tool) -----
        function renderTools(toolsData) {
            const tools = toolsData.tools || [];
            countSpan.textContent = tools.length;
            if (tools.length === 0) {
                grid.innerHTML = `<div class="empty-state" style="text-align:center;padding:3rem;color:#5a6f88;">Chưa có tool nào.</div>`;
                return;
            }

            let html = '';
            tools.forEach((tool, index) => {
                const latest = tool.versions[0] || {};
                const fileUrl = `tools/${tool.id}/${latest.downloadFile || ''}`;
                const iconHtml = tool.image
                    ? `<img src="${tool.image}" alt="${tool.name}">`
                    : tool.icon || '🔧';

                html += `
                    <div class="tool-card">
                        <div class="tool-header">
                            <div class="tool-avatar">${iconHtml}</div>
                            <div class="tool-name-group">
                                <div class="tool-name">${tool.name}</div>
                                <div class="tool-id">${tool.id}</div>
                            </div>
                        </div>
                        <div class="tool-description">${tool.description}</div>
                        <div class="tool-meta">
                            <span><i class="fas fa-folder"></i> ${tool.category || 'General'}</span>
                            <span><i class="fas fa-user"></i> ${tool.author || 'unknown'}</span>
                            <span><i class="fas fa-calendar-alt"></i> ${latest.date || 'N/A'}</span>
                            <span class="tool-size" id="size_${index}"><i class="fas fa-weight-hanging"></i> <span class="loading-shimmer"></span></span>
                        </div>
                        <a class="btn-detail" href="detail.html?id=${tool.id}">
                            <i class="fas fa-info-circle"></i> Chi tiết & tải về
                        </a>
                    </div>
                `;
            });
            grid.innerHTML = html;

            // Lấy kích thước file
            tools.forEach((tool, index) => {
                const latest = tool.versions[0];
                if (!latest || !latest.downloadFile) return;
                const fileUrl = `tools/${tool.id}/${latest.downloadFile}`;
                const sizeEl = document.getElementById(`size_${index}`);
                if (!sizeEl) return;
                getFileSize(fileUrl).then(sizeStr => {
                    if (sizeStr) {
                        sizeEl.innerHTML = `<i class="fas fa-weight-hanging"></i> ${sizeStr}`;
                    } else {
                        sizeEl.innerHTML = `<i class="fas fa-weight-hanging"></i> ? (không tìm thấy)`;
                        sizeEl.style.color = '#fb7185';
                    }
                });
            });
        }

        // ----- RENDER CHANGELOG (Accordion) -----
        function renderChangelog(updates) {
            if (!updates || updates.length === 0) {
                changelogContainer.innerHTML = `<div class="changelog-empty">Chưa có cập nhật nào.</div>`;
                return;
            }
            let html = '';
            updates.forEach((item, index) => {
                const isFirst = index === 0;
                html += `
                    <div class="changelog-item">
                        <button class="changelog-item-header" onclick="toggleChangelogItem(this)" aria-expanded="${isFirst}">
                            <span>
                                <span class="version-badge">${item.version}</span>
                                ${item.title || ''}
                            </span>
                            <span>
                                <span style="font-size:0.75rem;color:#5a6f88;margin-right:0.8rem;">${item.date || ''}</span>
                                <i class="fas fa-chevron-down toggle-icon ${isFirst ? 'open' : ''}"></i>
                            </span>
                        </button>
                        <div class="changelog-item-body ${isFirst ? 'open' : ''}">
                            <ul>
                                ${(item.changes || []).map(change => `<li>${change}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            });
            changelogContainer.innerHTML = html;
        }

        // Hàm toggle section (mở/đóng toàn bộ phần changelog)
        window.toggleSection = function(header) {
            const content = header.nextElementSibling;
            const icon = header.querySelector('.toggle-icon');
            content.classList.toggle('open');
            icon.classList.toggle('open');
        };

        // Hàm toggle từng item
        window.toggleChangelogItem = function(btn) {
            const body = btn.nextElementSibling;
            const icon = btn.querySelector('.toggle-icon');
            body.classList.toggle('open');
            icon.classList.toggle('open');
            btn.setAttribute('aria-expanded', body.classList.contains('open'));
        };

        // ----- FETCH DỮ LIỆU -----
        Promise.all([
            fetch('tools.json').then(res => res.ok ? res.json() : Promise.reject('tools.json')),
            fetch('changelog.json').then(res => res.ok ? res.json() : Promise.reject('changelog.json'))
        ])
        .then(([toolsData, changelogData]) => {
            renderTools(toolsData);
            renderChangelog(changelogData.updates || []);
        })
        .catch(err => {
            console.warn('Lỗi tải dữ liệu, dùng fallback:', err);
            const fallbackTools = {
                tools: [{
                    id: "GSAutoClicker-Rework",
                    name: "GS AutoClicker Rework",
                    icon: "🖱️",
                    description: "Công cụ tự động click chuột với giao diện hiện đại.",
                    category: "Utility",
                    author: "KHACK54321",
                    versions: [
                        { version: "1.0.0", tag: "stable", date: "2025-01-20", downloadFile: "gsautoclicker-rework.zip", changes: ["🎨 Giao diện mới"] }
                    ]
                }]
            };
            renderTools(fallbackTools);
            renderChangelog([
                { version: "1.0.0", date: "2025-02-15", title: "Phát hành AM-Tool Repository 1.0.0", changes: ["🎉 Ra mắt trang web"] }
            ]);
            const notice = document.createElement('div');
            notice.className = 'notice';
            notice.innerHTML = `<i class="fas fa-triangle-exclamation"></i> Không tìm thấy file JSON. Đang dùng dữ liệu mẫu.`;
            document.querySelector('.container').insertBefore(notice, document.querySelector('.tools-grid'));
        });
    })();
</script>
</body>
</html>
