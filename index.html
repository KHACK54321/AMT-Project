<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AM-Tool Repository</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .header-left .logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(167,139,250,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            overflow: hidden;
        }
        .header-left .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .header-left h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-left .sub { font-size:0.85rem; color:#8899b0; -webkit-text-fill-color:#8899b0; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .header-right .badge {
            background: rgba(167,139,250,0.15);
            border:1px solid rgba(167,139,250,0.2);
            padding:0.3rem 0.9rem;
            border-radius:20px;
            font-size:0.75rem;
            color:#a78bfa;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* Nút changelog popover */
        .changelog-trigger {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #b0c4db;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .changelog-trigger:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(167,139,250,0.3);
            color: #e8edf5;
        }
        .changelog-trigger i {
            font-size: 0.7rem;
        }

        .popover-wrapper {
            position: relative;
            display: inline-block;
        }
        .popover-content {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background: rgba(20,28,40,0.98);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 1rem;
            min-width: 320px;
            max-width: 400px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 100;
        }
        .popover-content.show {
            display: block;
        }
        .popover-content::-webkit-scrollbar {
            width: 4px;
        }
        .popover-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .popover-content::-webkit-scrollbar-thumb {
            background: #3b4a5e;
            border-radius: 4px;
        }
        .popover-content h4 {
            font-size: 0.85rem;
            color: #8899b0;
            margin-bottom: 0.6rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 0.4rem;
        }
        .popover-item {
            padding: 0.4rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .popover-item:last-child {
            border-bottom: none;
        }
        .popover-item .ver {
            font-weight: 600;
            color: #a78bfa;
            font-size: 0.8rem;
        }
        .popover-item .title {
            color: #e8edf5;
            font-size: 0.85rem;
        }
        .popover-item .date {
            color: #5a6f88;
            font-size: 0.7rem;
            margin-left: 0.5rem;
        }
        .popover-item .changes-list {
            list-style: none;
            padding: 0.3rem 0 0 0.8rem;
            margin: 0;
        }
        .popover-item .changes-list li {
            font-size: 0.75rem;
            color: #b8cce0;
            padding: 0.1rem 0;
            position: relative;
            padding-left: 1rem;
        }
        .popover-item .changes-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #60a5fa;
        }
        .popover-empty {
            color: #5a6f88;
            font-style: italic;
            font-size: 0.8rem;
            padding: 0.5rem 0;
        }

        /* TOOLS GRID */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px,1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .tool-card {
            background: rgba(20,28,40,0.7);
            backdrop-filter: blur(12px);
            border:1px solid rgba(255,255,255,0.06);
            border-radius:18px;
            padding:1.5rem;
            transition: all 0.3s;
            position:relative;
            overflow:hidden;
            display: flex;
            flex-direction: column;
        }
        .tool-card:hover {
            transform: translateY(-4px);
            border-color: rgba(167,139,250,0.2);
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.6);
        }
        .tool-card::before {
            content:'';
            position:absolute;
            top:0; left:0; right:0; height:2px;
            background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
            opacity:0;
            transition:opacity 0.3s;
        }
        .tool-card:hover::before { opacity:1; }
        .tool-header {
            display:flex;
            align-items:center;
            gap:1rem;
            margin-bottom:0.5rem;
        }
        .tool-avatar {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            flex-shrink: 0;
            overflow: hidden;
        }
        .tool-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .tool-name-group { flex:1; min-width:0; }
        .tool-name {
            font-size:1.25rem;
            font-weight:600;
            color:#f0f4fa;
        }
        .tool-id {
            font-size:0.7rem;
            color:#5a6f88;
            font-family:monospace;
            background:rgba(255,255,255,0.04);
            padding:0.1rem 0.5rem;
            border-radius:4px;
            display:inline-block;
            margin-top:0.1rem;
        }
        .tool-description {
            color:#b0c4db;
            font-size:0.92rem;
            line-height:1.6;
            margin:0.3rem 0 0.8rem 0;
            flex:1;
        }
        .tool-meta {
            display:flex;
            gap:1rem;
            font-size:0.75rem;
            color:#5a6f88;
            margin-bottom:1rem;
            flex-wrap:wrap;
        }
        .tool-meta i { margin-right:0.2rem; }
        .tool-size {
            color: #60a5fa;
            font-weight:500;
        }
        .btn-detail {
            display:inline-flex;
            align-items:center;
            gap:0.5rem;
            padding:0.5rem 1.2rem;
            border-radius:10px;
            font-weight:600;
            font-size:0.85rem;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color:#fff;
            border:none;
            cursor:pointer;
            text-decoration:none;
            transition: all 0.25s;
            justify-content:center;
        }
        .btn-detail:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(124,58,237,0.35); }

        .footer {
            margin-top:3rem;
            padding-top:1.5rem;
            border-top:1px solid rgba(255,255,255,0.04);
            text-align:center;
            font-size:0.8rem;
            color:#3b4a5e;
        }
        .loading-shimmer {
            display:inline-block;
            width:60px;
            height:1em;
            background: linear-gradient(90deg, #3b4a5e 25%, #5a6f88 50%, #3b4a5e 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius:4px;
            vertical-align:middle;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .notice {
            background:rgba(251,191,36,0.1);
            border:1px solid #fbbf24;
            border-radius:12px;
            padding:0.8rem 1.2rem;
            margin-bottom:1.5rem;
            color:#fbbf24;
            text-align:center;
        }
        @media (max-width:768px) {
            body { padding:1rem; }
            .header { flex-direction:column; align-items:flex-start; }
            .tools-grid { grid-template-columns:1fr; }
            .popover-content {
                right: -80px;
                min-width: 280px;
            }
        }
        @media (max-width:480px) {
            .popover-content {
                right: -120px;
                min-width: 260px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <!-- Thay bằng ảnh logo: <img src="images/logo-dark.png" alt="Logo"> -->
                <img src="images/logo-dark.png" alt="Logo">
            </div>
            <div>
                <h1>AM-Tool Repository</h1>
                <span class="sub">· GitHub Pages</span>
            </div>
        </div>
        <div class="header-right">
            <span class="badge">
                <i class="fas fa-database"></i> <span id="toolCount">0</span> tools
            </span>
            <!-- Nút changelog popover -->
            <div class="popover-wrapper">
                <button class="changelog-trigger" id="changelogTrigger">
                    <i class="fas fa-history"></i> Cập nhật
                </button>
                <div class="popover-content" id="changelogPopover">
                    <h4><i class="fas fa-list-ul"></i> Cập nhật của Repository</h4>
                    <div id="popoverList">
                        <div class="popover-empty">Đang tải...</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- DANH SÁCH TOOL -->
    <div class="tools-grid" id="toolsGrid"></div>

    <footer class="footer">
        <p><i class="fas fa-ghost"></i> AM-Tool Repository &mdash; Dữ liệu từ <code>tools.json</code> &amp; <code>changelog.json</code></p>
    </footer>
</div>

<script>
    (function() {
        const grid = document.getElementById('toolsGrid');
        const countSpan = document.getElementById('toolCount');
        const popoverList = document.getElementById('popoverList');
        const trigger = document.getElementById('changelogTrigger');
        const popover = document.getElementById('changelogPopover');

        // ----- TOGGLE POPOVER -----
        trigger.addEventListener('click', function(e) {
            e.stopPropagation();
            popover.classList.toggle('show');
        });
        document.addEventListener('click', function() {
            popover.classList.remove('show');
        });
        popover.addEventListener('click', function(e) {
            e.stopPropagation();
        });

        // ----- HÀM LẤY KÍCH THƯỚC FILE -----
        function getFileSize(url) {
            return fetch(url, { method: 'HEAD' })
                .then(res => {
                    if (!res.ok) throw new Error('File not found');
                    const size = res.headers.get('content-length');
                    if (size) {
                        const bytes = parseInt(size, 10);
                        return formatSize(bytes);
                    }
                    return null;
                })
                .catch(() => null);
        }
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
            return (bytes / 1073741824).toFixed(2) + ' GB';
        }

        // ----- RENDER DANH SÁCH TOOL -----
        function renderTools(toolsData) {
            const tools = toolsData.tools || [];
            countSpan.textContent = tools.length;
            if (tools.length === 0) {
                grid.innerHTML = `<div class="empty-state" style="text-align:center;padding:3rem;color:#5a6f88;">Chưa có tool nào.</div>`;
                return;
            }

            let html = '';
            tools.forEach((tool, index) => {
                const latest = tool.versions[0] || {};
                const fileUrl = `tools/${tool.id}/${latest.downloadFile || ''}`;
                const iconHtml = tool.icon
                    ? (tool.icon.endsWith('.png') || tool.icon.endsWith('.jpg') || tool.icon.endsWith('.svg')
                        ? `<img src="images/${tool.icon}" alt="${tool.name}">`
                        : tool.icon)
                    : '🔧';

                html += `
                    <div class="tool-card">
                        <div class="tool-header">
                            <div class="tool-avatar">${iconHtml}</div>
                            <div class="tool-name-group">
                                <div class="tool-name">${tool.name}</div>
                                <div class="tool-id">${tool.id}</div>
                            </div>
                        </div>
                        <div class="tool-description">${tool.description}</div>
                        <div class="tool-meta">
                            <span><i class="fas fa-folder"></i> ${tool.category || 'General'}</span>
                            <span><i class="fas fa-user"></i> ${tool.author || 'unknown'}</span>
                            <span><i class="fas fa-calendar-alt"></i> ${latest.date || 'N/A'}</span>
                            <span class="tool-size" id="size_${index}"><i class="fas fa-weight-hanging"></i> <span class="loading-shimmer"></span></span>
                        </div>
                        <a class="btn-detail" href="detail.html?id=${tool.id}">
                            <i class="fas fa-info-circle"></i> Chi tiết & tải về
                        </a>
                    </div>
                `;
            });
            grid.innerHTML = html;

            // Lấy kích thước file
            tools.forEach((tool, index) => {
                const latest = tool.versions[0];
                if (!latest || !latest.downloadFile) return;
                const fileUrl = `tools/${tool.id}/${latest.downloadFile}`;
                const sizeEl = document.getElementById(`size_${index}`);
                if (!sizeEl) return;
                getFileSize(fileUrl).then(sizeStr => {
                    if (sizeStr) {
                        sizeEl.innerHTML = `<i class="fas fa-weight-hanging"></i> ${sizeStr}`;
                    } else {
                        sizeEl.innerHTML = `<i class="fas fa-weight-hanging"></i> ? (không tìm thấy)`;
                        sizeEl.style.color = '#fb7185';
                    }
                });
            });
        }

        // ----- RENDER CHANGELOG POPOVER -----
        function renderPopover(updates) {
            if (!updates || updates.length === 0) {
                popoverList.innerHTML = `<div class="popover-empty">Chưa có cập nhật nào.</div>`;
                return;
            }
            let html = '';
            updates.forEach(item => {
                html += `
                    <div class="popover-item">
                        <div>
                            <span class="ver">${item.version}</span>
                            <span class="title">${item.title || ''}</span>
                            <span class="date">${item.date || ''}</span>
                        </div>
                        ${item.changes && item.changes.length > 0 ? `
                            <ul class="changes-list">
                                ${item.changes.map(c => `<li>${c}</li>`).join('')}
                            </ul>
                        ` : ''}
                    </div>
                `;
            });
            popoverList.innerHTML = html;
        }

        // ----- FETCH DỮ LIỆU -----
        Promise.all([
            fetch('tools.json').then(res => res.ok ? res.json() : Promise.reject('tools.json')),
            fetch('changelog.json').then(res => res.ok ? res.json() : Promise.reject('changelog.json'))
        ])
        .then(([toolsData, changelogData]) => {
            renderTools(toolsData);
            renderPopover(changelogData.updates || []);
        })
        .catch(err => {
            console.warn('Lỗi tải dữ liệu, dùng fallback:', err);
            // Fallback tools
            const fallbackTools = {
                tools: [{
                    id: "GSAutoClicker-Rework",
                    name: "GS AutoClicker Rework",
                    icon: "gsautoclicker-rework.png",
                    description: "Một công cụ mẫu minh họa đầy đủ tính năng.",
                    category: "Utility",
                    author: "dev-team",
                    versions: [
                        { version: "1.0.0", tag: "stable", date: "2025-01-20", downloadFile: "gsautoclicker-rework.zip", changes: ["🎨 Giao diện mới"] }
                    ]
                }]
            };
            renderTools(fallbackTools);
            renderPopover([
                { version: "1.0.0", date: "2025-02-15", title: "Phát hành AM-Tool Repository 1.0.0", changes: ["🎉 Ra mắt trang web"] }
            ]);
            const notice = document.createElement('div');
            notice.className = 'notice';
            notice.innerHTML = `<i class="fas fa-triangle-exclamation"></i> Không tìm thấy file JSON. Đang dùng dữ liệu mẫu.`;
            document.querySelector('.container').insertBefore(notice, document.querySelector('.tools-grid'));
        });
    })();
</script>
</body>
</html>
